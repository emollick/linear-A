name: Acquire pinned Linear A source
on:
  push:
    paths:
      - '.github/workflows/acquire-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and verify the public research corpus
        shell: bash
        run: |
          mkdir -p source
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          commit = '43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a'
          url = f'https://raw.githubusercontent.com/mwenge/lineara.xyz/{commit}/LinearAInscriptions.js'
          data = urllib.request.urlopen(url, timeout=60).read()
          blob_sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob_sha == 'ef41c58802a3135f295072ba60fc0df39450a10c', blob_sha
          pathlib.Path('source/LinearAInscriptions.js').write_bytes(data)
          provenance = dict(upstream_commit=commit, url=url, bytes=len(data), git_blob_sha=blob_sha, sha256=hashlib.sha256(data).hexdigest())
          pathlib.Path('source/provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          print(json.dumps(provenance, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-linear-a-source
          path: source/
          if-no-files-found: error
          retention-days: 7
